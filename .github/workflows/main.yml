
name: Delete Website Files

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE to confirm deleting all listed files and folders'
        required: true
        type: string

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Delete selected website files
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CONFIRMATION" != "DELETE" ]]; then
            echo "Confirmation failed. Nothing deleted."
            exit 1
          fi

          paths=(
            "about"
            "assets"
            "flowtype"
            "privacy"
            "404.html"
            "_headers"
            "favicon.svg"
            "index.html"
            "robots.txt"
          )

          for path in "${paths[@]}"; do
            if [[ -e "$path" ]]; then
              rm -rf -- "$path"
              echo "Deleted: $path"
            else
              echo "Skipped (not found): $path"
            fi
          done

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Delete website files and folders"
          git push
